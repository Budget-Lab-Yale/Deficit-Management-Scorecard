name: Test publication pipeline

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3.3"
          use-public-rspm: true
      - uses: r-lib/actions/setup-renv@v2
      - name: Build scorecard findings
        run: Rscript scripts/run_pipeline.R
      - name: Run tests
        run: Rscript scripts/run_tests.R
